[project]
name = "scribe-api"
version = "0.1.0"
description = "Scribe API"
requires-python = ">=3.11"
dependencies = [
    "scribe-core",
    "echo[sarvam]",
    # web
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "orjson>=3.10",
    "pydantic>=2.7",
    "PyJWT>=2.10",
    "authlib>=1.6",
    "joserfc>=1.0",
    "argon2-cffi>=23.1",
    "python-dateutil>=2.9",
    "requests>=2.32",
    "httpx>=0.27",
    "PyYAML>=6.0",
    "jsonpatch>=1.33",
    "ag-ui-protocol>=0.1.0",
    "mcp",
    # aws (s3/dynamo backends; endpoint-overridable)
    "boto3>=1.38",
    # db / state
    "asyncpg>=0.30",
    # audio
    "pydub>=0.25",
    # Python 3.13 removed stdlib audioop (pydub needs it); this restores it
    "audioop-lts>=0.2; python_version >= '3.13'",
    # llm providers reachable through echo
    "openai>=1.0",
    "anthropic>=0.18",
    "google-genai>=1.0",
    # documents / publish (feature-flagged, code retained)
    "markdown>=3.6",
    "python-docx>=1.1.2",
    "striprtf>=0.0.26",
    "google-api-python-client>=2.160",
    "google-auth>=2.38",
    # fhir (feature-flagged, code retained)
]

[tool.uv.sources]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/scribe"]
