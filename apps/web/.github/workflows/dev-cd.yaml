name: dev-argoCD

on:
  push:
    # Publish `dev-1.2.3` tags as releases.
    tags:
      - dev-*
env:
  # TODO: Change variable to your image's name.
  ECR_REPO_URL: ${{ secrets.DEV_ECR_REPO }}
  DOCKER_COMPOSE_FILE: docker-compose-test.yml
  HEALTHCHECK_URL: http://localhost:8080/ekascribe
  NAMESPACE: eka-dev
  HELM_REPO_NAME: eka-care-dev
  CHART_NAME: eka-care-dev-v1

jobs:
  build-test-push:
    permissions:
      id-token: write
      contents: read

    runs-on: dev-spot-ec2-runner-arm64
    # if: ${{ github.event_name == 'push' && github.event.base_ref == 'refs/heads/main' }}
    outputs:
      VERSION: ${{ steps.get_version.outputs.VERSION }}
    steps:
      - name: Setup kubeconfig for EKS
        run: |
          aws eks --region ap-south-1 update-kubeconfig --name dev-eks-1-29

      - name: Add Helm repo
        run: |
          helm repo add eka-care-dev 'https://raw.githubusercontent.com/eka-care/helm-charts/main/' \
          --username devops@eka.care \
          --password ${{ secrets.DEV_HELM_TOKEN }}
          helm repo update eka-care-dev

      - name: Checkout repo
        uses: actions/checkout@v3
        with:
          submodules: recursive # Fetch submodules
          token: ${{secrets.REPO_READ_ONLY_TOKEN}}

      - name: Update submodules to latest main
        run: |
         git submodule foreach 'git fetch origin && git checkout main && git pull origin main'

      #- name: Release TAG Checker Script
      # uses: eka-care/devops-scripts/actions/release-checker@rc-v1

      - name: Get the version
        id: get_version
        run: echo VERSION=$(echo $GITHUB_REF | cut -d / -f 3) >> $GITHUB_OUTPUT

      - name: Login to Docker Hub
        uses: docker/login-action@v1
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: iam role for the secrets manager
        uses: aws-actions/configure-aws-credentials@e3dd6a429d7300a6a4c196c26e071d42e0343502
        with:
          role-to-assume: arn:aws:iam::607765814920:role/github-secrets-role
          role-session-name: secret-role
          aws-region: ${{ secrets.DEV_AWS_Region }}

      - name: Read secrets from AWS Secrets Manager into environment variables
        uses: abhilash1in/aws-secrets-manager-action@v2.1.0
        with:
          secrets: |
            dev/scribe-web/all
          parse-json: false

      - name: Export secrets as build env vars
        run: |
          echo "$DEV_SCRIBE_WEB_ALL" | jq -r 'to_entries[] | "\(.key)=\(.value)"' >> $GITHUB_ENV

      - name: iam role for the github runner
        uses: aws-actions/configure-aws-credentials@e3dd6a429d7300a6a4c196c26e071d42e0343502
        with:
          role-to-assume: arn:aws:iam::607765814920:role/github-runner-role
          role-session-name: runner-role
          aws-region: ${{ secrets.DEV_AWS_Region }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1

      - name: Set up Buildx
        run: |
          docker buildx create --name mybuilder --driver docker-container --use || true

      # - name: Build docker images
      #   env:
      #     ECR_REPOSITORY: ${{ github.event.repository.name }}
      #     IMAGE_TAG: ${{ steps.get_version.outputs.VERSION }}
      #   run: |
      #     output=$(aws ecr list-images --region ap-south-1 --repository-name $ECR_REPOSITORY  | grep latest | tr -d '" ,' | cut -d ':' -f 2)
      #     echo $output
      #     if [[ "$output" == "latest" ]]
      #     then
      #        docker pull $ECR_REPO_URL/$ECR_REPOSITORY:latest
      #        docker build --cache-from $ECR_REPO_URL/$ECR_REPOSITORY:latest  --build-arg NEXT_PUBLIC_ENV=DEV -t $ECR_REPO_URL/$ECR_REPOSITORY:$IMAGE_TAG -f Dockerfile .
      #     else
      #        docker build --build-arg NEXT_PUBLIC_ENV=DEV -t $ECR_REPO_URL/$ECR_REPOSITORY:$IMAGE_TAG  -f Dockerfile .
      #     fi

      - name: Build Docker image
        env:
          ECR_REPOSITORY: ${{ github.event.repository.name }}
          IMAGE_TAG: ${{ steps.get_version.outputs.VERSION }}
          NEXT_PUBLIC_ENV: DEV
          BASE_IMAGE: 607765814920.dkr.ecr.ap-south-1.amazonaws.com/dev-base-images:node-22-alpine
        run: |
          docker buildx build \
            --platform=linux/arm64 \
            --progress=plain \
            --build-arg BASE_IMAGE=${BASE_IMAGE} \
            --build-arg NEXT_PUBLIC_ENV=${NEXT_PUBLIC_ENV} \
            --build-arg NEXT_PUBLIC_FIREBASE_API_KEY=${NEXT_PUBLIC_FIREBASE_API_KEY} \
            --build-arg NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN=${NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN} \
            --build-arg NEXT_PUBLIC_FIREBASE_PROJECT_ID=${NEXT_PUBLIC_FIREBASE_PROJECT_ID} \
            --build-arg NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET=${NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET} \
            --build-arg NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID=${NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID} \
            --build-arg NEXT_PUBLIC_FIREBASE_APP_ID=${NEXT_PUBLIC_FIREBASE_APP_ID} \
            --build-arg NEXT_PUBLIC_MIX_PANEL_KEY=${NEXT_PUBLIC_MIX_PANEL_KEY} \
            --build-arg NEXT_PUBLIC_CRISP_WEBSITE_ID=${NEXT_PUBLIC_CRISP_WEBSITE_ID} \
            --build-arg NEXT_PUBLIC_SENTRY_DSN=${NEXT_PUBLIC_SENTRY_DSN} \
            --cache-from=type=registry,ref=${ECR_REPO_URL}/${ECR_REPOSITORY}:buildcache-ekascribe-web \
            --cache-to=type=registry,ref=${ECR_REPO_URL}/${ECR_REPOSITORY}:buildcache-ekascribe-web,mode=max \
            -t ${ECR_REPO_URL}/${ECR_REPOSITORY}:${IMAGE_TAG} \
            -t ${ECR_REPO_URL}/${ECR_REPOSITORY}:latest \
            -f Dockerfile \
            --load .

      - name: Healthcheck test
        env:
          ECR_REPOSITORY: ${{ github.event.repository.name }}
          IMAGE_TAG: ${{ steps.get_version.outputs.VERSION }}
        run: |
          TAG=$ECR_REPO_URL/$ECR_REPOSITORY:$IMAGE_TAG docker-compose --file $DOCKER_COMPOSE_FILE up -d
          sleep 60
          docker ps -l -q | xargs docker logs
          output=$(curl -o /dev/null -s -w "%{http_code}\n" $HEALTHCHECK_URL)
            if [ "$output" == "200" ]; then
              echo "test success"
            else
              echo "test case failed"
              TAG=$ECR_REPO_URL/$ECR_REPOSITORY:$IMAGE_TAG docker-compose --file $DOCKER_COMPOSE_FILE down
            exit 1
          fi
          #TAG=$ECR_REPO_URL/$ECR_REPOSITORY:$IMAGE_TAG docker-compose --file $DOCKER_COMPOSE_FILE down

      # - name: Run tests Cases
      #  env:
      #     ECR_REPOSITORY: ${{ github.event.repository.name }}
      #     IMAGE_TAG: ${{ steps.get_version.outputs.VERSION }}
      #   run: |
      #     #TAG=$ECR_REPO_URL/$ECR_REPOSITORY:$IMAGE_TAG docker-compose --file $DOCKER_COMPOSE_FILE up -d
      #     #sleep 60.
      #       echo "test case passed"
      #     TAG=$ECR_REPO_URL/$ECR_REPOSITORY:$IMAGE_TAG docker-compose --file $DOCKER_COMPOSE_FILE down
      - name: Release info
        run: |
          echo ${{ github.action.release }}

      - name: Push image to Amazon ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ github.event.repository.name }}
          IMAGE_TAG: ${{ steps.get_version.outputs.VERSION }}
        run: |
          docker tag $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG $ECR_REGISTRY/$ECR_REPOSITORY:latest
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest
 
  deploy:
    needs: build-test-push
    runs-on: dev-spot-ec2-runner-arm64

    steps:
      - name: Setup kubeconfig for EKS
        run: |
          aws eks --region ap-south-1 update-kubeconfig --name dev-eks-1-29

      - name: Sync externalsecret $ECR_REPOSITORY-es
        env:
          ECR_REPOSITORY: ${{ github.event.repository.name }}
        run: |
          kubectl annotate externalsecret "$ECR_REPOSITORY-es" force-sync=$(date +%s) --overwrite -n $NAMESPACE

      - name: Repository Dispatch
        uses: peter-evans/repository-dispatch@v2
        with:
          token: ${{ secrets.argocd_github_token }}
          repository: eka-care/dev-argocd
          event-type: deploy-service
          client-payload: >-
            {"values_file_path": "ekascribe-web/values/dev-values.yaml", "image_tag": "${{ needs.build-test-push.outputs.VERSION }}", "ecr_repo_url": "${{ secrets.DEV_ECR_REPO }}", "ecr_repository": "${{ github.event.repository.name }}", "namespace": "eka-dev", "argocd_app_name": "${{ github.event.repository.name }}", "deployment_name": "${{ github.event.repository.name }}"}

      - name: ArgoCD App URL
        run: echo "https://argocd.dev.eka.care/applications/ekascribe-web"
