name: prod-argocd-CD
on:
  push:
    # Publish `prod-1.2.3` tags as releases.
    tags:
      - prod-*
env:
  # TODO: Change variable to your image's name.
  ECR_REPO_URL: ${{ secrets.PROD_ECR_REPO }}
  DOCKER_COMPOSE_FILE: docker-compose-test.yml
  HEALTHCHECK_URL: http://localhost:8080/ekascribe
  NAMESPACE: eka-prod
  HELM_REPO_NAME: eka-care-prod
  CHART_NAME: eka-care-prod-v1
  SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_EKA_RELEASES }}
  GITHUB_TOKEN: ${{ secrets.REPO_READ_ONLY_TOKEN }}

jobs:
  build-test-push:
    permissions:
      id-token: write
      contents: read
    if: ${{github.event.base_ref == 'refs/heads/main' }}
    runs-on: prod-spot-ec2-runner-arm64
    #     if: ${{ github.event_name == 'push' && github.event.base_ref == 'refs/heads/main' }}
    outputs:
      VERSION: ${{ steps.get_version.outputs.VERSION }}
    steps:
      - name: Setup kubeconfig for EKS
        run: |
          aws eks --region ap-south-1 update-kubeconfig --name eka-prod

      - name: Add Helm repo
        run: |
          helm repo add eka-care-prod 'https://raw.githubusercontent.com/eka-care/helm-charts/main/' \
          --username devops@eka.care \
          --password ${{ secrets.PROD_HELM_TOKEN }}
          helm repo update eka-care-prod

      - name: Checkout repo
        uses: actions/checkout@v3
        with:
          submodules: true # Fetch submodules
          token: ${{secrets.REPO_READ_ONLY_TOKEN}}

      - name: Update submodules to latest main
        run: |
         git submodule foreach 'git fetch origin && git checkout main && git pull origin main'

      - name: Get the version
        id: get_version
        run: echo VERSION=$(echo $GITHUB_REF | cut -d / -f 3) >> $GITHUB_OUTPUT

      - name: Login to Docker Hub
        uses: docker/login-action@v1
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: iam role for the github runner
        uses: aws-actions/configure-aws-credentials@e3dd6a429d7300a6a4c196c26e071d42e0343502
        with:
          role-to-assume: arn:aws:iam::559615561845:role/github-runner-role
          role-session-name: runner-role
          aws-region: ${{ secrets.PROD_AWS_Region }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1

      - name: Set up Buildx
        run: |
          docker buildx create --name mybuilder --driver docker-container --use || true

      - name: Build Docker image
        env:
          ECR_REPOSITORY: ${{ github.event.repository.name }}
          IMAGE_TAG: ${{ steps.get_version.outputs.VERSION }}
          BASE_IMAGE: 559615561845.dkr.ecr.ap-south-1.amazonaws.com/prod-base-images:node-22-alpine
          NEXT_PUBLIC_ENV: PROD
        run: |
          docker buildx build \
            --progress=plain \
            --build-arg NEXT_PUBLIC_ENV=${NEXT_PUBLIC_ENV} \
            --cache-from=type=registry,ref=${ECR_REPO_URL}/${ECR_REPOSITORY}:buildcache-ekascribe-web \
            --cache-to=type=registry,ref=${ECR_REPO_URL}/${ECR_REPOSITORY}:buildcache-ekascribe-web,mode=max \
            -t ${ECR_REPO_URL}/${ECR_REPOSITORY}:${IMAGE_TAG} \
            -t ${ECR_REPO_URL}/${ECR_REPOSITORY}:latest \
            -f Dockerfile \
            --load .

      - name: Healthcheck test
        env:
          ECR_REPOSITORY: ${{ github.event.repository.name }}
          IMAGE_TAG: ${{ steps.get_version.outputs.VERSION }}
        run: |
          TAG=$ECR_REPO_URL/$ECR_REPOSITORY:$IMAGE_TAG docker-compose --file $DOCKER_COMPOSE_FILE up -d
          sleep 60
          docker ps -l -q | xargs docker logs
          output=$(curl -o /dev/null -s -w "%{http_code}\n" $HEALTHCHECK_URL)
          if [ "$output" == "200" ]; then
            echo "test success"
          else
            echo "test case failed"
            TAG=$ECR_REPO_URL/$ECR_REPOSITORY:$IMAGE_TAG docker-compose --file $DOCKER_COMPOSE_FILE down
            exit 1
          fi
          #TAG=$ECR_REPO_URL/$ECR_REPOSITORY:$IMAGE_TAG docker-compose --file $DOCKER_COMPOSE_FILE down

      - name: Push image to Amazon ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ github.event.repository.name }}
          IMAGE_TAG: ${{ steps.get_version.outputs.VERSION }}
        run: |
          docker tag $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG $ECR_REGISTRY/$ECR_REPOSITORY:latest

          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest

  deploy:
    needs: build-test-push

    runs-on: prod-spot-ec2-runner-arm64
    # if: ${{ github.event_name == 'push' && github.event.base_ref == 'refs/heads/main' }}

    steps:
      - name: Setup kubeconfig for EKS
        run: |
          aws eks --region ap-south-1 update-kubeconfig --name eka-prod

      - name: Repository Dispatch
        uses: peter-evans/repository-dispatch@v2
        with:
          token: ${{ secrets.argocd_github_token }}
          repository: eka-care/prod-argocd
          event-type: deploy-service
          client-payload: >-
            {"values_file_path": "ekascribe-web/values/prod-values.yaml", "image_tag": "${{ needs.build-test-push.outputs.VERSION }}", "ecr_repo_url": "${{ secrets.PROD_ECR_REPO }}", "ecr_repository": "${{ github.event.repository.name }}", "namespace": "eka-prod"}

      - name: Wait for new version rollout
        env:
          IMAGE_TAG: ${{ needs.build-test-push.outputs.VERSION }}
          APP_NAME: ekascribe-web
          NAMESPACE: eka-prod
        run: |
          echo "Waiting for ArgoCD to sync image $IMAGE_TAG..."
          for i in $(seq 1 60); do
            CURRENT=$(kubectl get deployment $APP_NAME -n $NAMESPACE \
              -o jsonpath='{.spec.template.spec.containers[0].image}' 2>/dev/null \
              | rev | cut -d: -f1 | rev || echo "")
            echo "Attempt $i: running=$CURRENT expected=$IMAGE_TAG"
            if [ "$CURRENT" = "$IMAGE_TAG" ]; then
              echo "ArgoCD synced — waiting for rollout..."
              kubectl rollout status deployment/$APP_NAME -n $NAMESPACE --timeout=600s
              exit $?
            fi
            sleep 10
          done
          echo "Timed out waiting for image sync"
          exit 1

      - name: Set Release Version from Tag
        run: echo "RELEASE_VERSION=${{ github.ref_name }}" >> $GITHUB_ENV

      - name: Release notification Script
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_EKA_RELEASES  }}
        uses: eka-care/devops-scripts/actions/release-notification@rn-v10

      - name: Deploy Summary
        if: always()
        env:
          IMAGE_TAG: ${{ needs.build-test-push.outputs.VERSION }}
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            STATUS="✅ Deployed"
          elif [ "${{ job.status }}" = "cancelled" ]; then
            STATUS="⚠️ Cancelled"
          else
            STATUS="❌ Failed / rolled back"
          fi
          {
            echo "## 🚀 Deploy: ekascribe-web"
            echo ""
            echo "| Field | Value |"
            echo "|-------|-------|"
            echo "| **App** | ekascribe-web |"
            echo "| **Version** | ${IMAGE_TAG} |"
            echo "| **Namespace** | eka-prod |"
            echo "| **Status** | ${STATUS} |"
            echo "| **ArgoCD** | [Open ↗](https://argocd.eka.care/applications/ekascribe-web) |"
            echo "| **Liveview** | [Deployments ↗](https://liveview.orbi.health/c/main/deployments) |"
          } >> $GITHUB_STEP_SUMMARY
