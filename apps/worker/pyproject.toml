[project]
name = "scribe-worker"
version = "0.1.0"
description = "ekascribe pipeline worker (chunk STT, stitching, structuring)"
requires-python = ">=3.11"
dependencies = [
    "scribe-core",
    "scribe-api",
    "echo[sarvam]",
    "procrastinate>=2.13",
    "httpx>=0.27",
    "orjson>=3.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/scribe_worker"]
