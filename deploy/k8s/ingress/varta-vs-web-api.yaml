# Path-based routing on varta.bharatai.gov.in:
#   /api/*  -> ekascribe-api:8000  (with /api prefix stripped, since API serves from root)
#   /*      -> ekascribe-web:3000
#
# Replaces the existing varta-vs (same name/namespace):
#   kubectl apply -f varta-vs-web-api.yaml --kubeconfig=./Kubeconfig_BharatAI.yaml
---
apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: varta-vs
  namespace: eka-care
spec:
  gateways:
  - varta-gw
  hosts:
  - varta.bharatai.gov.in
  http:
  # Order matters: most specific match first.
  - name: api
    match:
    - uri:
        prefix: /api/
    - uri:
        exact: /api
    rewrite:
      uri: /
    route:
    - destination:
        host: ekascribe-api.eka-care.svc.cluster.local
        port:
          number: 8000
  # Catch-all: everything else goes to the web app.
  - name: web
    route:
    - destination:
        host: ekascribe-web.eka-care.svc.cluster.local
        port:
          number: 3000
