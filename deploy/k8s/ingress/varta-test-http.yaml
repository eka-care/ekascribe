# HTTP-only test setup for varta.bharatai.gov.in → ekascribe-api:8000
# No TLS secret needed — works without istio-system access.
# Apply with:
#   kubectl apply -f varta-test-http.yaml --kubeconfig=./Kubeconfig_BharatAI.yaml
---
apiVersion: networking.istio.io/v1beta1
kind: Gateway
metadata:
  name: varta-gw
  namespace: eka-care
spec:
  selector:
    istio: ingressgateway
  servers:
  - hosts:
    - varta.bharatai.gov.in
    port:
      name: http
      number: 80
      protocol: HTTP
    # no tls block, no httpsRedirect — plain HTTP for testing
---
apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: varta-vs
  namespace: eka-care
spec:
  gateways:
  - varta-gw
  hosts:
  - varta.bharatai.gov.in
  http:
  - route:
    - destination:
        host: ekascribe-api.eka-care.svc.cluster.local
        port:
          number: 8000
