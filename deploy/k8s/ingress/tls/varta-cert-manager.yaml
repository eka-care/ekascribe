# EMERGENCY FALLBACK ONLY — not applied. The live cert is the eMudhra wildcard
# in the TCL-owned secret istio-ingress/vaarta-server-tls (see the gateway
# file); renewals go through TCL. If that ever breaks, apply this to get a
# self-signed cert, then point the gateway's credentialName at varta-tls.
#
#   kubectl --context openweb apply -f varta-cert-manager.yaml
#   kubectl --context openweb -n eka-care get certificate varta-tls -w   # wait for READY=True
#
# NOTE: only cert-manager-created secrets ever worked from the tenant
# namespace on openweb (TCL machinery syncs them to the gateway); a plain
# `kubectl create secret tls` in eka-care is never picked up by SDS.
---
# SelfSigned issuer: signs the cert with its own key. Namespaced Issuer, not
# ClusterIssuer — clusterissuers are 403 for the `customer` user.
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: varta-selfsigned
  namespace: eka-care
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: varta-tls
  namespace: eka-care
spec:
  # cert-manager writes/renews the kubernetes.io/tls secret the gateway's
  # credentialName points at. Envoy picks up rotations live via SDS — no
  # restart, no gateway change.
  secretName: varta-tls
  issuerRef:
    name: varta-selfsigned
    kind: Issuer
  # Both spellings, same as the openssl cnf, so the rename can finish later.
  dnsNames:
    - vaarta.bharatai.gov.in
  duration: 2160h    # 90d
  renewBefore: 360h  # renew 15d before expiry
  privateKey:
    algorithm: RSA
    size: 2048
# After recovery, delete the Certificate + Issuer again and point the gateway
# back at the TCL secret — do not leave both paths active.
