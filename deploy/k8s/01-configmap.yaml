# Non-secret configuration for the api pod and the migrate Job.
# Secrets live in 02-secret.yaml. Mirrors .env.example -- keep them in sync.
apiVersion: v1
kind: ConfigMap
metadata:
  name: ekascribe-config
  namespace: eka-care
  labels:
    app.kubernetes.io/part-of: ekascribe
data:
  # --- Deployment ---------------------------------------------------------
  ENV: "prod"

  # Public https base of the app. Browser-facing URLs (signed blob/upload
  # URLs, discovery doc, session URLs) are derived from it, so it MUST be the
  # hostname the ingress serves — https, or the mic won't record. The
  # pipeline's own PATCH callback also uses it (out through the ingress and
  # back; matches the proven compose deployment). No API_BASE_URL needed —
  # it falls back to SELF_URL + /voice.
  SELF_URL: "http://vaarta.bharatai.gov.in"
  # The api image ships the static web UI at /app/web-static and serves it at /
  # (scribe/web_static.py). The bundle uses relative URLs, so no WEB_URL or
  # NEXT_PUBLIC_* host vars exist anymore. Unset this to run the pod API-only.
  WEB_DIST_DIR: "/app/web-static"

  # --- Pluggable backends -------------------------------------------------
  STORAGE_BACKEND: "local"
  DB_BACKEND: "postgres"
  QUEUE_BACKEND: "postgres"
  STATE_BACKEND: "postgres"

  # --- Pipeline execution -------------------------------------------------
  # inprocess = the STT/stitch/structure/finalize pipeline runs as background
  # jobs inside the API process; there is no worker Deployment.
  #
  # This is why the api Deployment is 1 replica with UVICORN_WORKERS=1:
  # background/runner.py keeps jobs in the scheduling process only, so a job
  # must stay visible to the process that scheduled it. Jobs are also
  # non-durable -- a pod restart drops anything in flight.
  # Switching to EXECUTION_MODE=worker means adding a worker Deployment.
  EXECUTION_MODE: "inprocess"
  # Chunk coordination lives in Postgres (audio_chunks claims), so 2 uvicorn
  # workers are safe — matches the compose prod deployment.
  UVICORN_WORKERS: "2"
  BACKGROUND_JOB_CONCURRENCY: "4"

  # --- Storage ------------------------------------------------------------
  # STORAGE_BACKEND=local: recordings live on the api pod's PVC
  # (07-api-storage-pvc.yaml) — NOT scratch space. Survives restarts.
  STORAGE_ROOT: "/data/storage"
  S3_BUCKET: "voice-records"
  # Read directly via os.getenv() by voice2rx (scribe_agent_runs.py,
  # conversion_pipeline.py) -- setting S3_BUCKET alone is not enough.
  S3_VADED_BUCKET_NAME: "voice-records"
  AWS_REGION: "ap-south-1"

  # --- Auth (v1: dev-token mode) ------------------------------------------
  AUTH_MODE: "dev"
  DEV_B_ID: "onprem-workspace"
  DEV_UUID: "00000000-0000-0000-0000-000000000001"
  DEV_OID: "onprem-doctor-oid"
  AUTH_ISSUER: "scribe.local"
  # OIDC_ISSUER / OIDC_AUTHORIZE_URL / OIDC_TOKEN_URL also fall back to
  # SELF_URL (discovery.py). They are inert under AUTH_MODE=dev; set them
  # explicitly if you ever switch to AUTH_MODE=jwt.

  # --- Models: STT — self-hosted transcribe service -----------------------
  ECHO_DEFAULT_TRANSCRIBER_PROVIDER: "model_api"
  MODEL_API_BASE_URL: "http://vaarta-model.bharatai.gov.in/v1"
  ECHO_DEFAULT_TRANSCRIBER_MODEL: "/model/parrotlet-a"

  # --- Models: LLM — Open WebUI fronting qwen -----------------------------
  # OPENWEBUI_API_KEY lives in 02-secret.yaml.
  ECHO_DEFAULT_LLM_PROVIDER: "openwebui"
  ECHO_DEFAULT_LLM_MODEL: "qwen3-27b"
  OPENWEBUI_BASE_URL: "https://bharatai.gov.in"
  OPENWEBUI_API_KEY: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpZCI6ImYzZGM4OTY3LTFmNmYtNGI1Ni1iMTI1LWMzNTFhM2EyMzAzYiIsImV4cCI6MTc4ODc4MzI1NiwianRpIjoiODc5ZWZmYTMtNDRkNy00YjQ3LWJkMzktNDZmYWE4M2UwOGY5IiwiaWF0IjoxNzg2MzY0MDU2fQ.EdGymypC1fFa5h5PM3PN1dxI5sk2jtjR1olAI3ru5GM"
  OPENWEBUI_ENABLE_THINKING: "false"
  ECHO_DEFAULT_LLM_TEMPERATURE: "0"
  OPENWEBUI_VERIFY_SSL: "false"

  # --- Prompts ------------------------------------------------------------
  ECHO_PROMPT_PROVIDER: "file"
  ECHO_PROMPT_DIR: "/app/prompts"

  # --- Logging ------------------------------------------------------------
  LOG_DIR: "/data/logs"
  LOG_LEVEL: "INFO"

  # --- Feature flags ------------------------------------------------------
  FEATURE_STREAMING: "false"
  FEATURE_FHIR: "false"
  FEATURE_PUBLISH_INTEGRATIONS: "false"
  FEATURE_PATIENT_DIRECTORY: "false"
  FEATURE_RECORDS_VAULT: "false"
  FEATURE_PAYMENTS: "false"
  FEATURE_DRUG_SEARCH: "true"

  # --- Formulary (drug catalog search) ------------------------------------
  # echo's PostgresClient (asyncpg) reads these as discrete fields rather than
  # a DSN, so they duplicate what DATABASE_URL in 02-secret.yaml already says.
  # Both point at the StatefulSet in 05-postgres-statefulset.yaml -- one
  # database serves the app tables, the queue and the formulary catalog.
  # ECHO_PG_PASSWORD is in the Secret.
  #
  # Note the code-level fallbacks differ (port 5433, db/user `matrix`, in
  # apps/api/scripts/setup_medication_db.py). If these keys ever go missing the
  # client does not fail loudly -- it tries somewhere else entirely.
  ECHO_PG_HOST: "ekascribe-postgres.eka-care.svc.cluster.local"
  ECHO_PG_PORT: "5432"
  ECHO_PG_DATABASE: "scribe"
  ECHO_PG_USER: "scribe"

  # --- Discovery doc ------------------------------------------------------
  DISCOVERY_SUPPORT_EMAIL: "admin@example.com"
