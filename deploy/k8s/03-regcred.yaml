# ############################################################################
# Image pull credential for the PRIVATE Docker Hub repo ekacare/ekascribe.
# Without it every pod fails with:
#   ImagePullBackOff -- pull access denied, repository does not exist
#
# PLACEHOLDERS ONLY -- DO NOT COMMIT REAL VALUES.
#
# Preferred: create it straight against the cluster, using a Docker Hub
# ACCESS TOKEN (hub.docker.com -> Account Settings -> Personal access tokens),
# never an account password:
#
#   kubectl create secret docker-registry ekascribe-regcred -n eka-care \
#     --docker-server=https://index.docker.io/v1/ \
#     --docker-username=YOUR_USER \
#     --docker-password=YOUR_ACCESS_TOKEN
#
# Secrets are namespaced -- this must exist in eka-care specifically. A
# regcred sitting in `default` will not be found.
#
# If you fill this file in instead, `auth` is base64("username:token"):
#   printf 'YOUR_USER:YOUR_ACCESS_TOKEN' | base64 -w0
# then keep it out of commits with:
#   git update-index --skip-worktree deploy/k8s/03-regcred.yaml
# ############################################################################
apiVersion: v1
kind: Secret
metadata:
  name: ekascribe-regcred
  namespace: eka-care
  labels:
    app.kubernetes.io/part-of: ekascribe
type: kubernetes.io/dockerconfigjson
stringData:
  .dockerconfigjson: |
    {"auths":{"https://index.docker.io/v1/":{"username":"REPLACE_ME","password":"REPLACE_ME_ACCESS_TOKEN","auth":"REPLACE_ME_BASE64_OF_USER_COLON_TOKEN"}}}
