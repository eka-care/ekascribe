apiVersion: apps/v1
kind: Deployment
metadata:
  name: ekascribe-api
  namespace: eka-care
  labels:
    app.kubernetes.io/name: ekascribe-api
    app.kubernetes.io/part-of: ekascribe
spec:
  # 2 for serving availability. Be precise about what this does and does not
  # buy, because EXECUTION_MODE=inprocess is still in play:
  #
  #   IT DOES: keep the HTTP API up when one pod dies. Uploads and job-status
  #   reads go through Postgres, so either pod answers them correctly.
  #
  #   IT DOES NOT: make the scribe pipeline durable or distributed. Each pod
  #   runs its OWN independent BackgroundJobRunner -- an in-process thread pool
  #   (background/runner.py) holding jobs in memory, fire-and-forget. A job
  #   scheduled on pod A is invisible to pod B, and losing pod A drops whatever
  #   it had in flight. That was equally true at 1 replica, so this is strictly
  #   better for availability, not worse -- but it is not pipeline HA.
  #
  # For durable at-least-once retries across restarts, switch EXECUTION_MODE to
  # worker and add a worker Deployment (deploy/Dockerfile.worker). Note that
  # UVICORN_WORKERS must stay 1 regardless: that constraint is about processes
  # inside one pod, not about replicas.
  replicas: 1
  # RollingUpdate, not Recreate. Recreate would take BOTH pods down at once and
  # throw away the availability the second replica exists for. maxUnavailable 0
  # keeps one pod serving throughout; maxSurge 1 means a rollout briefly needs
  # room for a third pod (3 x 3.5 = 10.5 vCPU).
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ekascribe-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ekascribe-api
        app.kubernetes.io/part-of: ekascribe
    spec:
      hostAliases:
        - ip: "10.185.27.69"
          hostnames:
            - "varta-model.bharatai.gov.in"    
        # - ip: "100.78.69.4"
        #   hostnames:
        #     - "varta.bharatai.gov.in"                     
      imagePullSecrets:
        - name: ekascribe-regcred
      # Without this the scheduler is free to place both replicas on one node,
      # which makes the second one useless for node failure -- the exact thing
      # it exists for. `preferred`, not `required`: spread them when possible,
      # but never leave a pod Pending because nothing else has room.
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: ekascribe-api
      # The api opens its psycopg pool at import time, so a pod that starts
      # before Postgres is accepting connections crashloops instead of
      # retrying. Matters most on a whole-node restart, where `strategy:
      # Recreate` gives this pod no surviving replica to fall back on.
      initContainers:
        - name: wait-for-postgres
          image: postgres:16-alpine
          command:
            - sh
            - -c
            - |
              until pg_isready -h ekascribe-postgres -p 5432 -U scribe -d scribe; do
                echo "waiting for postgres..."
                sleep 2
              done
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 128Mi
      containers:
        # Container name is `api` -- deploy/push.sh prints
        # `kubectl set image deploy/ekascribe-api api=...` to pin a tag.
        - name: api
          image: ekacare/ekascribe:api-latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: ekascribe-config
            - secretRef:
                name: ekascribe-secrets
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          # STORAGE_BACKEND=local: /data/storage is the recording store and
          # rides the PVC (07-api-storage-pvc.yaml); logs stay ephemeral.
          volumeMounts:
            - name: storage
              mountPath: /data/storage
            - name: logs
              mountPath: /data/logs
          # PER POD -- half of the api tier's 7 vCPU / 13Gi budget, since
          # replicas is 2. Change both together.
          #
          # requests == limits, so these pods get Guaranteed QoS: the capacity
          # is actually reserved and the kubelet evicts them last under node
          # pressure rather than first. The tradeoff is that the reservation is
          # held whether or not the pipeline is busy.
          resources:
            requests:
              cpu: 3500m
              memory: 6656Mi
            limits:
              cpu: 3500m
              memory: 6656Mi
      volumes:
        - name: storage
          persistentVolumeClaim:
            claimName: ekascribe-api-storage
        - name: logs
          emptyDir: {}
