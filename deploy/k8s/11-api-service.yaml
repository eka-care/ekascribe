# The name here is load-bearing: SELF_URL in 01-configmap.yaml resolves to
# ekascribe-api.eka-care.svc.cluster.local. Renaming this Service means
# updating SELF_URL to match.
apiVersion: v1
kind: Service
metadata:
  name: ekascribe-api
  namespace: eka-care
  labels:
    app.kubernetes.io/name: ekascribe-api
    app.kubernetes.io/part-of: ekascribe
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: ekascribe-api
  ports:
    - name: http
      port: 8000
      targetPort: http
      protocol: TCP
