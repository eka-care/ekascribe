# Overlay: run the SAME containers against AWS-shaped backends.
#   LocalStack:  docker compose -f docker-compose.yml -f docker-compose.aws.yml up
#   Real AWS:    set the endpoints empty and provide real credentials.
services:
  localstack:
    image: localstack/localstack:latest
    environment:
      SERVICES: s3,dynamodb,sqs
    ports:
      - "4566:4566"

  api:
    environment:
      STORAGE_BACKEND: s3
      DB_BACKEND: dynamodb
      QUEUE_BACKEND: sqs
      S3_BUCKET: voice-records
      S3_ENDPOINT_URL: http://localstack:4566
      DYNAMODB_ENDPOINT_URL: http://localstack:4566
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
    depends_on:
      - localstack

  worker:
    environment:
      STORAGE_BACKEND: s3
      DB_BACKEND: dynamodb
      S3_ENDPOINT_URL: http://localstack:4566
      DYNAMODB_ENDPOINT_URL: http://localstack:4566
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
    depends_on:
      - localstack
