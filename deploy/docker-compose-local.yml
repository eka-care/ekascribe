# Scribe — LOCAL stack (locked to the working local setup).
#   postgres + api (which also serves the web UI at :8000); worker via
#   --profile worker. No Redis, no AWS. The web bundle is a static export with
#   relative URLs — no host baked in, no separate web container.
#   Usage: docker compose -f deploy/docker-compose-local.yml up -d --build
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: scribe
      POSTGRES_PASSWORD: scribe
      POSTGRES_DB: scribe
    # loopback-only so the DB is never exposed off-box; native `make api/setup`
    # connect via 127.0.0.1 (use 127.0.0.1 in DATABASE_URL — on macOS
    # "localhost" resolves to ::1 first, which this binding does not serve).
    # Host port 5433 to coexist with a natively installed Postgres on 5432;
    # containers still reach it as postgres:5432 on the compose network.
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scribe"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.api
    restart: unless-stopped
    env_file: ../.env
    environment:
      DATABASE_URL: postgresql://scribe:scribe@postgres:5432/scribe
      ECHO_PG_HOST: postgres
      ECHO_PG_PORT: 5432
      # override .env's relative ./storage so api + worker share the mounted volume
      STORAGE_ROOT: /data/storage
    volumes:
      - storage:/data/storage
      - logs:/data/logs
      - ./certs:/certs:ro   # drop private CA pem files here (OPENWEBUI_CA_BUNDLE=/certs/<file>.pem)
    ports:
      - "8000:8000"   # fronted by infra SSL on the VM (https://bharat-backend.dev.eka.care)
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s

  worker:
    # Only for EXECUTION_MODE=worker: docker compose --profile worker up
    # (and set EXECUTION_MODE=worker + UVICORN_WORKERS>1 on api). Default mode
    # (inprocess) runs the pipeline inside the api container, so this stays off.
    profiles: ["worker"]
    build:
      context: ..
      dockerfile: deploy/Dockerfile.worker
    restart: unless-stopped
    env_file: ../.env
    environment:
      DATABASE_URL: postgresql://scribe:scribe@postgres:5432/scribe
      ECHO_PG_HOST: postgres
      ECHO_PG_PORT: 5432
      STORAGE_ROOT: /data/storage
      # PATCH callbacks go to the api service, not the worker's own localhost
      SELF_URL: http://api:8000
    volumes:
      - storage:/data/storage
      - logs:/data/logs
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
  storage:
  logs:
