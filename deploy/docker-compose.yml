# Default on-prem profile: four containers, no Redis, no AWS.
# Overlays: docker-compose.aws.yml (LocalStack / real AWS backends).
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: scribe
      POSTGRES_PASSWORD: scribe
      POSTGRES_DB: scribe
    ports:
      - "127.0.0.1:5432:5432"   # loopback only; native `make api/worker/setup` still works
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scribe"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.api
    env_file: ../.env
    environment:
      DATABASE_URL: postgresql://scribe:scribe@postgres:5432/scribe
      # override .env's relative ./storage so api + worker share the mounted volume
      STORAGE_ROOT: /data/storage
    volumes:
      - storage:/data/storage
      - logs:/data/logs
    ports:
      - "8000:8000"   # fronted by infra SSL (https://bharat-backend.dev.eka.care)
    depends_on:
      postgres:
        condition: service_healthy

  worker:
    # Only needed for EXECUTION_MODE=worker. Start with: docker compose --profile worker up
    # (and set EXECUTION_MODE=worker + UVICORN_WORKERS on api). Default mode
    # (inprocess) runs the pipeline inside the api container, so this stays off.
    profiles: ["worker"]
    build:
      context: ..
      dockerfile: deploy/Dockerfile.worker
    env_file: ../.env
    environment:
      DATABASE_URL: postgresql://scribe:scribe@postgres:5432/scribe
      # share the same audio storage as the api container
      STORAGE_ROOT: /data/storage
      # PATCH callbacks go to the api service, not the worker's own localhost
      SELF_URL: http://api:8000
    volumes:
      - storage:/data/storage
      - logs:/data/logs
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.web
      args:
        NEXT_PUBLIC_API_HOST: ${SELF_URL:-http://localhost:8000}
        NEXT_PUBLIC_WEB_HOST: ${WEB_URL:-http://localhost:3000}
    environment:
      NEXT_PUBLIC_API_HOST: ${SELF_URL:-http://localhost:8000}
    ports:
      - "3000:3000"   # fronted by infra SSL (https://bharat-net.dev.eka.care)
    depends_on:
      - api

volumes:
  pgdata:
  storage:
  logs:
