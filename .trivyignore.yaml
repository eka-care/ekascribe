# Accepted vulnerability findings. Reviewed 2026-08-13.
#
# YAML format rather than plain .trivyignore because only this one supports
# expired_at -- an accepted risk that never resurfaces is not an accepted risk.
# Re-review each entry on expiry rather than bumping the date reflexively.
#
# !! Trivy (0.73) auto-discovers plain `.trivyignore` but NOT this file. Every
# invocation must pass it explicitly or these suppressions silently do nothing
# and the scan just looks noisier than it is:
#
#     trivy image --ignorefile .trivyignore.yaml ...
#
# NOTE ON ffmpeg: the ~117 HIGH findings against ffmpeg/libav*/libsw* are
# deliberately NOT listed here. They currently have no fix in trixie, so
# `--ignore-unfixed` already excludes them from the build gate, and it does so
# dynamically -- the moment Debian ships a patch they reappear on their own.
# Pinning them here by CVE id would suppress them even after a fix exists,
# which is strictly worse than leaving them alone. ffmpeg parses untrusted
# uploaded audio, so it is the last thing that should be silenced by hand.

vulnerabilities:
  - id: CVE-2026-23949
    # jaraco.context 5.3.0, vendored inside setuptools in the BASE IMAGE's
    # system python (/usr/local/lib/python3.11/site-packages/setuptools/_vendor/).
    # Not in /app/.venv, not in uv.lock, not importable by the application.
    statement: "Not reachable: setuptools-vendored copy in system python, outside the app venv."
    expired_at: 2026-11-11

  - id: CVE-2026-24049
    # wheel 0.45.1, same setuptools _vendor directory. The top-level system
    # wheel is already 0.46.3, i.e. above the 0.46.2 fixed version -- only
    # setuptools' bundled older copy matches. Also absent from /app/.venv.
    statement: "Not reachable: setuptools-vendored copy in system python; top-level wheel is already 0.46.3."
    expired_at: 2026-11-11
