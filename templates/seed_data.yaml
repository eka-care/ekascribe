- id: 7d03dd95-45b2-41e1-a5d3-fba98fee0418
  title: General Physician Note
  type: default
  desc: |-
    Convert the doctor–patient consultation into a structured General Physician (GP) OPD clinical note. Tag each section with its kind (list / table / narrative). Include only sections that have data.

    1. Patient Demographics — list

    * Full Name
    * Age (years; for children <5, years and months)
    * Gender (Male / Female / Other)
    * Contact Number
    * Address / Area (locality or city)

    2. Visit Information — list

    * Visit Date
    * Visit Type (First Visit / Follow-Up / Emergency Walk-In / Review After Investigation)
    * Referred By

    3. Chief Complaint — list

    * Primary Complaint with duration (e.g. "fever for 3 days"); if multiple, in order of priority
    * Duration of Complaint (exact, as stated)

    4. History of Present Illness (HPI) — list

    * Illness Narrative using SOCRATES where applicable (Site, Onset, Character, Radiation, Associated symptoms, Timing/pattern, Exacerbating/Relieving factors, Severity); include progression, self-medication or prior treatment, and response
    * Fever Details (if fever): temperature (°F/°C), duration, pattern (Continuous / Intermittent / Remittent / Hectic), chills/rigors (present/absent), associated rash (present/absent)
    * Pain Details (if pain): site, character (dull aching / sharp / burning / colicky / throbbing / cramping), severity (0–10), radiation, aggravating factors, relieving factors

    5. Review of Systems — list (positives and pertinent negatives for each)

    * Cardiovascular: chest pain, palpitations, dyspnoea on exertion, ankle swelling, syncope
    * Respiratory: cough (dry/productive), sputum, breathlessness, wheeze, haemoptysis
    * Gastrointestinal: nausea, vomiting, abdominal pain, bloating, altered bowel habits, blood in stool, jaundice
    * Genitourinary: dysuria, frequency, nocturia, haematuria, urinary retention, discharge
    * Neurological: headache, dizziness, vertigo, tingling/numbness, weakness, seizures, altered consciousness
    * Musculoskeletal: joint pain, swelling, stiffness, muscle pain, backache
    * ENT / Eyes: sore throat, runny nose, nasal congestion, ear pain, visual disturbance
    * Skin: rash, itching, jaundice, pallor, cyanosis

    6. Past Medical History — list

    * Chronic Conditions (Hypertension, Diabetes, Hypo/Hyperthyroidism, Asthma, COPD, CAD, Heart Failure, CKD, Epilepsy, Stroke, TB, Anaemia, Obesity, Other) with duration if stated
    * Previous Hospitalizations / Surgeries (hospital, year, reason)
    * Previous Illnesses / Infections (typhoid, dengue, COVID-19, hepatitis)

    7. Current Medications — table

    * columns: Medication, Dose, Frequency, Duration
    * Include prescription meds; OTC / self-medicated (Paracetamol, antacids, cough syrups); herbal / traditional (Ayurvedic, homeopathic, home remedies). Do not infer generic names or doses.

    8. Allergies — list

    * Drug Allergies: drug and reaction; state "No known drug allergies (NKDA)" if none
    * Food / Environmental Allergies

    9. Family History — list

    * Hereditary / familial conditions with relationship to patient (e.g. diabetes in parents, hypertension in siblings, cardiac disease)

    10. Social & Lifestyle History — list

    * Occupation
    * Tobacco Use (Non-smoker / Current smoker / Ex-smoker / Chews tobacco / Smokeless tobacco; pack-years if mentioned)
    * Alcohol Use (None / Social / Regular / Heavy / Ex-drinker; quantity/frequency)
    * Diet (Vegetarian / Non-Vegetarian / Vegan / Mixed)
    * Physical Activity (sedentary / active / walks daily)
    * Marital Status (Single / Married / Divorced / Widowed)

    11. Vital Signs — list

    * Blood Pressure (systolic/diastolic mmHg; arm — Left / Right / Both)
    * Heart Rate / Pulse (bpm; regular/irregular)
    * Respiratory Rate (breaths/min)
    * Temperature (°F / °C as stated)
    * SpO2 (%; room air or supplemental oxygen)
    * Weight (kg)
    * Height (cm)
    * BMI (kg/m²; only if explicitly stated — do not calculate)
    * Blood Glucose (if measured): value (mg/dL), type (Fasting / Post-prandial / Random / HbA1c)

    12. Physical Examination — list (positives and pertinent negatives)

    * General Appearance: conscious/oriented, well/ill-looking, pallor, icterus, cyanosis, clubbing, lymphadenopathy, oedema
    * Cardiovascular: heart sounds (S1, S2, murmurs), apex beat, peripheral pulses
    * Respiratory: air entry, breath sounds (vesicular/bronchial), added sounds (wheeze, rhonchi, crepitations), chest expansion
    * Abdominal: tenderness (location), organomegaly, bowel sounds, guarding/rigidity
    * Neurological: consciousness (GCS if mentioned), cranial nerves, motor/sensory deficits, reflexes, gait
    * ENT: throat (congested / inflamed tonsils), nasal mucosa, ear findings
    * Skin / Dermatological: rash, lesions, pallor, icterus, urticaria — location, morphology, distribution
    * Musculoskeletal: joint swelling, tenderness, range of motion, deformity

    13. Investigations Ordered / Results Reviewed — table

    * columns: Investigation, Result / Status, Date
    * Lab tests ordered (CBC, LFT, RFT, thyroid profile, blood culture, dengue NS1); imaging ordered (X-ray, USG, CT) with indication; previous results reviewed with values (e.g. "HbA1c 8.2%", "Hb 9.4 g/dL"). Do not infer or calculate values.

    14. Assessment / Diagnosis — list

    * Primary / Working Diagnosis (ICD-10 only if explicitly stated)
    * Secondary Diagnoses / Comorbidities active at this visit
    * Differential Diagnoses (only if explicitly mentioned)
    * Clinical Reasoning (stated reasoning, risk stratification, diagnostic impression)

    15. Treatment Plan — list

    * Medications Prescribed: each drug — name, dose, route, frequency, duration as stated (e.g. "Tab. Paracetamol 500 mg orally three times daily × 5 days"). Do not infer or substitute generics.
    * Non-Pharmacological Measures (dietary modifications, activity restrictions, hydration, wound care, physiotherapy)
    * Procedures Performed (nebulization, IV drip, wound dressing, injection)

    16. Patient Advice & Counselling — list

    * Lifestyle & Dietary Advice (e.g. increase fluids, avoid spicy food, bed rest)
    * Warning Signs / Red Flags (when to return)
    * Vaccination / Preventive Advice (flu, Hep B, other immunisation discussed or given)

    17. Follow-Up Instructions — list

    * Follow-Up Date / Duration (e.g. "review after 5 days")
    * Follow-Up Conditions (return earlier if — e.g. fever >104°F, breathing worsens)
    * Pending Reports / Tests awaited

    18. Referrals — list

    * Referral specialty, reason, urgency, facility/doctor name (e.g. "referred to cardiologist for chest pain evaluation")

    19. Follow-Up Note (follow-up visits only) — list

    * Response to Previous Treatment (improved / no change / worsened)
    * Medication Compliance (Compliant / Partially compliant / Non-compliant / Not assessed)
    * New Complaints Since Last Visit
    * Changes to Management (dose changes, additions / discontinuations)

    CLINICAL CUES

    * Fever: capture temperature (°F/°C), duration, pattern (continuous / intermittent / remittent / hectic), and associated chills/rigors and rash.
    * Pain: capture SOCRATES (site, onset, character, radiation, associated symptoms, timing, exacerbating/relieving factors, severity 0–10).
    * Screen common comorbidities (hypertension, diabetes, thyroid, asthma/COPD); record screened negatives in Past Medical History (e.g. "no diabetes").
    * Capture drug/brand names exactly as stated (e.g. Calpol, Dolo, Pan-D); do not convert brand ↔ generic.
    * Prescription completeness: each drug needs name + dose + frequency + duration; if an element was not stated, leave it blank — do not fill in typical values.
    * Document measured values only — do not label BP as "hypertensive" or temperature as "febrile" unless the doctor states it.
    * In multi-system presentations, capture all complaints; do not prioritise one unless the doctor does.
    * Paediatric (<18): capture the accompanying guardian's name, relationship, and concerns; weight-for-age if a growth concern is raised.
    * Follow-ups: document what changed since the last visit — symptom status, compliance, new investigations, medication adjustments, overall trajectory.

    RULES

    * Include only sections that have data. Omit any section with no data — never write "not mentioned", "not applicable", or placeholders like [?], [unknown], [not specified].
    * Never fabricate or infer. Write only what is explicitly stated or clearly implied; do not predict generic drug names, diagnoses, or interpretations.
    * Capture pertinent negatives as well as positive findings (e.g. "no fever", "no history of diabetes", "denies chest pain").
    * Translate all output to English, whatever the language of consultation.
    * Write in third person ("the patient", "he", "she"); never address the patient as "you".
    * Do not repeat the same information across sections.
    * If there is no medically relevant content whatsoever, return exactly: No medical information is available in this conversation.
  section_ids: []
