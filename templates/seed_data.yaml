# Seed data loaded by scripts/setup.py.
# FIVE description/markdown-based default templates (no section-wise templates).
# Each template's `desc` is the full structuring prompt; `section_ids` stays empty
# so input_preparers.py routes it through the markdown agent.
# The first three ids are the hardcoded defaults referenced in language_config.py,
# stream_session_router.py, and patient_summary_service.py — do not change them.

sections: []
templates:
- id: 9d9675c6-b29b-424a-abac-99ddd3b8909c
  title: Clinical Notes
  type: default
  desc: |-
    Convert the doctor–patient consultation into a structured clinical note. Tag each section with its kind (list / table / narrative). Include only sections that have data.
    1.  Patient Demographics — list
    - Name, DOB, gender, contact information
    2.  Visit Information — list
    - Date/time of encounter, visit type (first visit / follow-up)
    3.  Chief Complaint — list
    - Primary reason for visit and duration of symptoms
    4.  History of Present Illness — list
    - Chronological narrative: onset, location, duration, characterization, aggravating/alleviating factors, associated symptoms, prior treatments attempted
    5.  Review of Systems — list
    - Systematic review by body system, with positives and pertinent negatives
    6.  Past Medical History — list
    - Chronic conditions, previous surgeries/procedures, major hospitalizations, significant past illnesses
    7.  Current Medications / Treatment — table
    - columns: Medication, Dose, Frequency, Duration
    - Include current medications/treatments, OTC medications, supplements/herbal remedies. Do not infer generics or indications.
    8.  Allergies — list
    - Medication, food, and environmental allergies with the nature of the reaction
    9.  Social History — list
    - Occupation / work environment, living situation, tobacco / alcohol / substance use, diet / exercise patterns, relevant social determinants of health
    10. Family History — list
    - Hereditary conditions and health status of immediate family members, with relationship
    11. Lifestyle Habits / History — list
    - Smoking history (current / ex-smoker, pack-years), alcohol and substance use, dietary habits, physical activity, childhood history, occupational exposures, other long-term lifestyle factors
    12. Vital Signs — list
    - Temperature, pulse, respiratory rate, blood pressure, pain score, height, weight, BMI, oxygen saturation
    13. Physical Examination — list
    - General appearance and findings by body system, with pertinent positives and negatives
    14. Laboratory / Diagnostic Results — table
    - columns: Test, Result, Date
    - Test results, imaging findings, and previous significant results for comparison
    15. Assessment — list
    - Diagnoses, clinical reasoning, differential diagnoses
    16. Treatment Plan — list
    - Treatment plan for the diagnosis, medications prescribed, ordered tests / procedures
    17. Procedures Performed — list
    - Description of procedures, findings / outcomes, complications (if any)
    18. Advices — list
    - Home care instructions, warning signs to watch for, return precautions
    19. Follow-up Instructions — list
    - Date / time / duration and instructions for the follow-up appointment
    20. Referrals — list
    - Referral to another doctor / speciality / ward, with reason
    RULES
    - Include only sections that have data. Omit any section with no data — never write "not mentioned", "not specified", or placeholders like [?], [unknown].
    - Never fabricate or infer. Write only what is explicitly stated or clearly implied; do not predict drug generics, indications, or interpretations.
    - Capture pertinent negatives as well as positive findings (e.g. "no fever", "no history of diabetes").
    - Translate all output to English, whatever the language of consultation.
    - Write in third person ("the patient", "he", "she"); never address the patient as "you".
    - Do not repeat the same information across sections.
    - If there is no medically relevant content whatsoever, return exactly: No medical information is available in this conversation.
  section_ids: []
- id: 2f1c9a44-7e6b-4c21-9b3a-1d2e3f4a5b6c
  title: Default Prescription Print
  type: default
  desc: |-
    Convert the transcription into a structured clinical note. Return each section with its kind (one of: list, table, narrative). Include only sections that have data.
    SECTIONS — keep this order:
    Patient Demographics — list — Name, DOB, Age, Gender, Contact
    Visit Information — list — Date/time, visit type (first visit / follow-up)
    Chief Complaint — list — primary reason + duration
    History of Present Illness — list — onset, location, duration, character, aggravating/relieving factors, associated symptoms, prior treatment
    Review of Systems — list — positives + pertinent negatives (e.g. "No chest pain")
    Past Medical History — list — chronic conditions, surgeries, hospitalizations (+ year if stated)
    Medication History — table — columns: Medication, Dose, Frequency, Reason (ongoing meds only)
    Allergies — table — columns: Type, Allergen, Reaction
    Social History — list — Occupation, Living situation, Tobacco, Alcohol, Substance use, Diet, Exercise
    Family History — table — columns: Relation, Condition
    Travel History — list
    Vaccination History — list
    Vital Signs — list — Temperature, Pulse, RR, BP, SpO2, Height, Weight, BMI, Pain score
    Physical Examination — list — each item "system/area: finding" (include pertinent negatives)
    Laboratory/Diagnostic Results — table — columns: Test, Result, Reference Range
    Past Investigations — table — columns: Test, Date, Result
    Assessment — list — diagnoses, differentials, clinical reasoning
    Prescribed Medications — medication_table — columns: Medication, Dose, Quantity, Route, Frequency, Duration, Instructions (see below)
    Prescribed Investigations — list — ordered tests (+ urgency if stated)
    Prescribed Procedures — list — procedure + schedule/details
    Prescribed Vaccinations — list — vaccine + schedule
    Procedures Performed — list — procedure, findings/outcome, complications
    Advice — list — home care, warning signs, return precautions
    Follow-up — list — timeline + purpose
    Referral — list — Doctor, Speciality, Reason
    Notes — narrative — medically relevant info not fitting above (always last)
    PRESCRIBED MEDICATIONS — one row per drug:
    Medication column: include the form prefix when spoken (e.g. "Tab. Paracetamol", "Syp. Ambroxol", "Cap. Amoxicillin", "Inj. Diclofenac").
    Fill only the columns explicitly spoken; leave a cell empty if that detail was not stated. Never guess.
    Expand frequency abbreviations: OD → once daily, BD → twice daily, TDS → three times daily, QID → four times daily, SOS → as needed, stat → immediately.
    RULES
    Do not include section numbering anywhere in the output. Section titles must appear as plain names (e.g. "Chief Complaint", not "3. Chief Complaint").
    Omit any section that has no data. Never emit an empty section, a placeholder, or markers like [?], [unknown], [not specified].
    Never fabricate, guess, or infer (do not predict drug generics, indications, or reference ranges). Write only what is stated or clearly implied.
    Capture explicit negatives (e.g. "No fever", "No history of diabetes").
    Translate all content to English if the transcription is in another language.
    Use third person, professional clinical language ("the patient", "he", "she"); never address the patient as "you".
    Do not repeat the same information across sections.
    If there is no medically relevant content whatsoever, return exactly: No medical information is available in this conversation.
