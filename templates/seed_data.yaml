- id: 19288d2f-81a9-46a6-b804-9651242a9b3e
  title: SOAP Notes
  type: default
  desc: |-
    Convert the doctor–patient consultation into a structured SOAP note. Always include all four sections; each is descriptive prose (narrative). If a section has no data, write "None".
    1.  Subjective — narrative
    - Information reported by the patient: chief complaint and duration; history of present illness (onset, location, duration, character, radiation, aggravating/relieving factors, associated symptoms, progression, prior treatment and response); relevant review of systems with positives and pertinent negatives; pertinent past medical, surgical, medication, allergy, family, and social/lifestyle history as volunteered. Capture the patient's own description of symptoms and concerns.
    2.  Objective — narrative
    - Measurable, observable data from the encounter: vital signs (temperature, pulse, respiratory rate, blood pressure, SpO2, height, weight, BMI, pain score); general appearance and physical examination findings by system, with pertinent positives and negatives; results of laboratory tests, imaging, and other investigations reviewed at this visit (with values and dates as stated); in-clinic procedures performed and their findings.
    3.  Assessment — narrative
    - The clinician's interpretation of the subjective and objective data: primary / working diagnosis; differential diagnoses; severity or stage; relevant risk factors; and any clinical reasoning, prognosis, or risk stratification explicitly discussed.
    4.  Plan — narrative
    - The management roadmap: medications prescribed or modified (name, dose, route, frequency, duration as stated); non-pharmacological measures; investigations or tests ordered; procedures planned; patient education and counselling; warning signs / return precautions; referrals (specialty, reason); and follow-up timing and instructions.
    RULES
    - Always output all four sections in order. If a section has no data, write exactly: None
    - Never fabricate or infer. Write only what is explicitly stated or clearly implied; do not predict drug generics, indications, diagnoses, or interpretations.
    - Capture pertinent negatives as well as positive findings (e.g. "no fever", "denies chest pain").
    - Translate all output to English, whatever the language of consultation.
    - Write in third person ("the patient", "he", "she"); never address the patient as "you".
    - Do not repeat the same information across sections (subjective vs objective vs assessment vs plan).
    - If there is no medically relevant content whatsoever, return exactly: No medical information is available in this conversation.
  section_ids: []
